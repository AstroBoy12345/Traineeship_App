<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Traineeship Portal</title>
    <style>
       * {
            box-sizing: border-box;
        }
        body { 
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: 0;
        }
        form { margin-bottom: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 10px; padding: 10px; background: #5c67f2; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 7px;}
        .navbar {
            font-family: Arial, sans-serif;
            background-color: #333;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

        }
        .navbar a:hover {
            background-color: #575757;
        }
    </style>
</head>

<body>

<div class="navbar">
    <button type="button" style="float: right; display: block; background: #5c67f2; color: white; border: none; border-radius: 5px; padding: 7px; cursor: pointer; margin-right: 10px;" th:onclick="|window.location.href='@{/auth/logout}'|">Logout</button>
    
</div>
<main style="display: flex; flex-direction: column; align-items: center; margin-top: 50px; position: relative; z-index: 1;">
    <h1 style="font-size: 2.5em; color: #fff; margin-bottom: 20px;">
        Welcome to the Traineeship Portal Student,
    </h1>

    <p style="font-size: 1.2em; color: #fff; margin-bottom: 30px;">
        Explore your dashboard to manage your profile, logbook, and traineeship opportunities!
    </p>

    <div>
        <button type="button" style="float: right; margin-right: 10px;" th:onclick="|window.location.href='@{/student/logbook}'|">Logbook</button>
        <button type="button" style="float: right; margin-right: 10px;" th:onclick="|window.location.href='@{/student/studentprofile}'|">Profile</button>
    </div>
</main>

</body>
</html>
