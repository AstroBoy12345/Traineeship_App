<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Traineeship Position</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 700px;
            margin: 100px auto 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        form button[type="submit"] {
            margin-top: 20px;
            background-color: #5c67f2;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        form button[type="submit"]:hover {
            background-color: #4a52c4;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
    <button th:onclick="'window.location.href=\'' + @{/company/addtraineeship} + '\''">Add New Traineeship</button>
    <button th:onclick="'window.location.href=\'' + @{/company/companyprofile} + '\''">Profile</button>
</div>

<main>
    <h2>Announce a New Traineeship Position</h2>
    <form action="/company/dashboard/positionsNew/save" method="post">
        <label>Title:</label>
        <input type="text" name="title" required>

        <label>Description:</label>
        <textarea name="description" required></textarea>

        <label>Location:</label>
        <input type="text" name="location" required>

        <label>Start Date:</label>
        <input type="date" name="fromDate" required>

        <label>End Date:</label>
        <input type="date" name="toDate" required>

        <label>Required Skills (comma-separated):</label>
        <input type="text" name="skills">

        <label>Topics of Interest (comma-separated):</label>
        <input type="text" name="topics">

        <button type="submit">Create Traineeship</button>
    </form>
</main>

</body>
</html>
