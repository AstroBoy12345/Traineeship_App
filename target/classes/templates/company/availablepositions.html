<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Traineeship Positions</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 90%;
            margin: 100px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            overflow-x: auto;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .no-results {
            margin-top: 20px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>

<div class="navbar">

    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
    <button th:onclick="'window.location.href=\'' + @{/company/addtraineeship} + '\''">Add New Traineeship</button>
    <button th:onclick="'window.location.href=\'' + @{/company/companyprofile} + '\''">Profile</button>
</div>

<main>
    <h2>Available Traineeship Positions</h2>

    <div th:if="${positions.size() == 0}" class="no-results">
        No available traineeship positions found.
    </div>

    <table th:if="${positions.size() > 0}">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Skills</th>
                <th>Topics</th>
                <th>From Date</th>
                <th>To Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="position : ${positions}">
                <td th:text="${position.title}">Title</td>
                <td th:text="${position.description}">Description</td>
                <td th:text="${position.skills}">Skills</td>
                <td th:text="${position.topics}">Topics</td>
                <td th:text="${#temporals.format(position.fromDate, 'dd/MM/yyyy')}">From Date</td>
                <td th:text="${#temporals.format(position.toDate, 'dd/MM/yyyy')}">To Date</td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
