<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Traineeships</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px 14px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 95%;
            margin: 100px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            overflow-x: auto;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .assign-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, .assign-btn {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .assign-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        .assign-btn:hover {
            background-color: #218838;
        }

        .no-results {
            margin-top: 20px;
            font-style: italic;
            color: #555;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
</div>

<main>
    <h2>📌 All Traineeship Positions</h2>

    <div th:if="${availablePositions == null or availablePositions.isEmpty()}" class="no-results">
        No traineeship positions here.
    </div>

    <table th:if="${availablePositions != null and !availablePositions.isEmpty()}">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Topics</th>
                <th>Student</th>
                <th>Professor</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="position : ${availablePositions}">
                <td th:text="${position.title}">Title</td>
                <td th:text="${position.description}">Description</td>
                <td th:text="${position.topics}">Topics</td>
                <td th:text="${position.student != null ? position.student.studentName : '—'}">Student</td>
                <td th:text="${position.professor != null ? position.professor.professorName : '—'}">Professor</td>
                <td>
                    <form th:action="@{/committee/assign-supervisor}" method="post" class="assign-form">
                        <input type="hidden" name="positionId" th:value="${position.id}" />
                        <select name="strategy" required>
                            <option value="interests">By Interests</option>
                            <option value="load">By Load</option>
                        </select>
                        <button type="submit" class="assign-btn">Assign</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div style="text-align: center;">
        <a th:href="@{/committee/dashboard}" class="back-button">← Back to Dashboard</a>
    </div>
</main>

</body>
</html>
