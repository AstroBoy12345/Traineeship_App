<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalize Traineeships</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px 14px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 900px;
            margin: 100px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background-color: #f9f9f9;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .field {
            margin-bottom: 12px;
        }

        .label {
            font-weight: bold;
        }

        .status-label {
            font-size: 16px;
            font-weight: bold;
            color: #155724;
            margin-top: 10px;
        }

        .fail .status-label {
            color: #721c24;
        }

        ul {
            margin-top: 8px;
            padding-left: 20px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #218838;
        }

        .no-positions {
            text-align: center;
            font-size: 18px;
            color: #888;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
</div>

<main>
    <h1>✅ Finalize Assigned Traineeships</h1>

    <div th:if="${successMessage}" class="message" style="color: green;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="message" style="color: red;" th:text="${errorMessage}"></div>

    <div th:if="${positions != null and !positions.isEmpty()}">
        <div th:each="position : ${positions}" th:class="'card ' + (position.passFailGrade == null ? '' : (position.passFailGrade ? 'pass' : 'fail'))">

            <div class="field"><span class="label">Position:</span> <span th:text="${position.title}"></span></div>
            <div class="field"><span class="label">Student:</span> <span th:text="${position.student?.studentName ?: '—'}"></span></div>
            <div class="field"><span class="label">Professor:</span> <span th:text="${position.professor?.professorName ?: '—'}"></span></div>
            <div class="field"><span class="label">Company:</span> <span th:text="${position.company?.companyName ?: '—'}"></span></div>

            <div th:if="${position.passFailGrade != null}" class="status-label">
                <span th:text="${position.passFailGrade ? '✅ Passed' : '❌ Failed'}"></span>
            </div>

            <hr>

            <div th:each="eval : ${position.evaluations}" th:if="${eval.evaluationType.name() == 'COMPANY_EVAL'}">
                <div class="field"><span class="label">🏢 Company Evaluation:</span></div>
                <ul>
                    <li>Motivation: <span th:text="${eval.motivation}">0</span></li>
                    <li>Efficiency: <span th:text="${eval.efficiency}">0</span></li>
                    <li>Effectiveness: <span th:text="${eval.effectiveness}">0</span></li>
                </ul>
            </div>

            <div th:each="eval : ${position.evaluations}" th:if="${eval.evaluationType.name() == 'PROFESSOR_EVAL'}">
                <div class="field"><span class="label">🎓 Professor Evaluation:</span></div>
                <ul>
                    <li>Motivation: <span th:text="${eval.motivation}">0</span></li>
                    <li>Efficiency: <span th:text="${eval.efficiency}">0</span></li>
                    <li>Effectiveness: <span th:text="${eval.effectiveness}">0</span></li>
                    <li>Facilities & Guidance: <span th:text="${eval.facilitiesAndGuidance}">0</span></li>
                </ul>
            </div>

            <form th:action="@{/committee/finalize}" method="post" th:if="${position.passFailGrade == null}">
                <input type="hidden" name="positionId" th:value="${position.id}" />
                <div class="radio-group">
                    <label><input type="radio" name="passFail" value="true" required> ✅ Pass</label>
                    <label><input type="radio" name="passFail" value="false"> ❌ Fail</label>
                </div>
                <button type="submit" class="submit-btn">Finalize Result</button>
            </form>
        </div>
