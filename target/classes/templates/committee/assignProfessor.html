<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traineeship Assignment Summary</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px 14px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 700px;
            margin: 100px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .field {
            margin-bottom: 15px;
        }

        .label {
            font-weight: bold;
        }

        .value {
            margin-left: 10px;
        }

        .not-assigned {
            color: #dc3545;
            font-style: italic;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
</div>

<main>
    <h2>📄 Traineeship Assignment Summary</h2>

    <div class="field">
        <span class="label">Position Title:</span>
        <span class="value" th:text="${position.title}">--</span>
    </div>

    <div class="field">
        <span class="label">Description:</span>
        <span class="value" th:text="${position.description}">--</span>
    </div>

    <div class="field">
        <span class="label">Topics:</span>
        <span class="value" th:text="${position.topics}">--</span>
    </div>

    <div class="field">
        <span class="label">Company Location:</span>
        <span class="value" th:text="${position.company?.companyLocation}">--</span>
    </div>

    <hr>

    <div class="field">
        <span class="label">Assigned Student:</span>
        <span class="value" th:if="${position.student != null}" th:text="${position.student.studentName + ' (' + position.student.username + ')'}">--</span>
        <span class="not-assigned" th:if="${position.student == null}">Not assigned yet</span>
    </div>

    <div class="field">
        <span class="label">Assigned Professor:</span>
        <span class="value" th:if="${position.professor != null}" th:text="${position.professor.professorName}">--</span>
        <span class="not-assigned" th:if="${position.professor == null}">Not assigned yet</span>
    </div>

    <div style="text-align: center;">
        <button th:onclick="'window.location.href=\'' + @{/committee/dashboard} + '\''" class="back-button">← Back to Dashboard</button>
    </div>
</main>

</body>
</html>
