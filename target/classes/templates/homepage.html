<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Menu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: 0;
        }

        form { margin-bottom: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 10px; padding: 10px; background: #5c67f2; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
    </style>
</head>
<body>
        
        <main style="display: flex; flex-direction: column; align-items: center; margin-top: 50px; position: relative; z-index: 1;">
            <h1 style="font-size: 2.5em; color: #fff; margin-bottom: 20px;">
                Welcome to the Traineeship Portal
            </h1>
    
            <p style="font-size: 1.2em; color: #fff; margin-bottom: 30px;">
                Here you can find your perfect traineeship opportunity!
            </p>
    
            <div>
                <button type="button" onclick="window.location.href='/auth/signup';">Sign Up</button>
                <button type="button" onclick="window.location.href='/auth/login';">Login</button>
            </div>
        </main>
</body>
</html>
