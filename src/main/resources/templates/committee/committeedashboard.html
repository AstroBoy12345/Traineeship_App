<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Committee Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }
        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px 14px;
            margin-top: 7px;
            margin-bottom: 7px;
        }
        main {
            max-width: 700px;
            margin-top: 80px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            text-align: center;
            position: relative;
            z-index: 1;
            color: #333;
        }
        main h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        main p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        main button {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="|window.location.href='@{/auth/logout}'|">Logout</button>
</div>

<main>
    <h1>Welcome to the Committee Dashboard</h1>
    <p>Manage students and traineeships from here:</p>

    <button th:onclick="|window.location.href='@{/committee/students}'|">
        📋 View All Students
    </button>

    <button th:onclick="|window.location.href='@{/committee/traineeships}'|">
        📌 View Traineeships to Assign a Professor
    </button>

    <button th:onclick="|window.location.href='@{/committee/final-reports}'|">
        ✅ View Assigned Positions & Finalize
    </button>
</main>

</body>
</html>
