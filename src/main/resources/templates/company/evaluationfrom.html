<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Evaluation Form - Traineeship</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 600px;
            margin: 120px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button.submit-btn {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #5c67f2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button.submit-btn:disabled {
            background-color: grey;
            cursor: not-allowed;
        }

        .alert {
            color: red;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
    <button th:onclick="'window.location.href=\'' + @{/company/addtraineeship} + '\''">Add Traineeship</button>
    <button th:onclick="'window.location.href=\'' + @{/company/companyprofile} + '\''">Profile</button>
</div>

<main>
    <h2>Company Evaluation Form</h2>

    <form th:action="@{/company/dashboard/positions/evaluate/{id}(id=${positionId})}" method="post" th:object="${evaluation}">
        <label>Motivation:</label>
        <select th:field="*{motivation}">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <label>Effectiveness:</label>
        <select th:field="*{effectiveness}">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <label>Efficiency:</label>
        <select th:field="*{efficiency}">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <button type="submit"
                class="submit-btn"
                th:disabled="${alreadyEvaluated}">
            Submit Evaluation
        </button>

        <p th:if="${alreadyEvaluated}" class="alert">
            Έχετε ήδη καταχωρήσει αξιολόγηση για αυτή τη θέση.
        </p>
    </form>
</main>

</body>
</html>
