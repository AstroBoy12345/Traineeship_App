<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Profile</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        form label {
            margin-top: 15px;
            display: block;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #5c67f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a52c4;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Your Company Profile</h2>

    <form th:action="@{/company/details/save}" th:object="${company}" method="post">
        <label>Company Name:</label>
        <input type="text" th:field="*{companyName}" required />

        <label>Location:</label>
        <select th:field="*{companyLocation}" required>
            <option value="">-- Select Location --</option>
            <option value="Athens">Athens</option>
            <option value="Ioannina">Ioannina</option>
            <option value="Thessaloniki">Thessaloniki</option>
        </select>

        <button type="submit">Save Profile</button>
    </form>
</div>

</body>
</html>
