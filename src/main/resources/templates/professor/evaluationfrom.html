<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Evaluation Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .navbar a,
        .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .navbar button {
            float: right;
            background-color: #5c67f2;
            margin-right: 10px;
            border-radius: 5px;
            padding: 7px;
            margin-top: 7px;
            margin-bottom: 7px;
        }

        main {
            max-width: 800px;
            margin: 100px auto 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            margin-top: 25px;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:disabled {
            background-color: grey;
            cursor: not-allowed;
        }

        .already-evaluated {
            color: red;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button th:onclick="'window.location.href=\'' + @{/auth/logout} + '\''">Logout</button>
    <button th:onclick="'window.location.href=\'' + @{/professor/dashboard} + '\''">Dashboard</button>
    <button th:onclick="'window.location.href=\'' + @{/professor/professorprofile} + '\''">Profile</button>
</div>

<main>
    <h2>Professor Evaluation Form</h2>

    <form th:action="@{/professor/dashboard/positions/evaluate/{id}(id=${positionId})}" method="post" th:object="${evaluation}">

        <label for="motivation">Motivation:</label>
        <select th:field="*{motivation}" id="motivation">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <label for="effectiveness">Effectiveness:</label>
        <select th:field="*{effectiveness}" id="effectiveness">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <label for="efficiency">Efficiency:</label>
        <select th:field="*{efficiency}" id="efficiency">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <label for="facilitiesAndGuidance">Facilities and Guidance:</label>
        <select th:field="*{facilitiesAndGuidance}" id="facilitiesAndGuidance">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <button type="submit" class="submit-btn"
                th:disabled="${alreadyEvaluated}"
                th:style="${alreadyEvaluated} ? 'background-color: grey; cursor: not-allowed;' : ''">
            Submit Evaluation
        </button>

        <p th:if="${alreadyEvaluated}" class="already-evaluated">
            You have already submitted an evaluation for this position.
        </p>

    </form>
</main>

</body>
</html>
