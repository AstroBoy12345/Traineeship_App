<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Professor Profile</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        form label {
            margin-top: 15px;
            display: block;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #5c67f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a52c4;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Your Professor Profile</h2>

    <form th:action="@{/professor/details/save}" th:object="${professor}" method="post">
        <label for="professorName">Full Name:</label>
        <input type="text" id="professorName" th:field="*{professorName}" required />

        <label for="interests">Interests:</label>
        <input type="text" id="interests" th:field="*{interests}" required />

        <button type="submit">Create Profile</button>
    </form>
</div>

</body>
</html>
