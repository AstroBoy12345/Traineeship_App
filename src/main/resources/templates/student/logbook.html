<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traineeship Logbook</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('/library.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
            
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5); /* dark overlay */
            z-index: 0;
        }

        .navbar, h2, form, .form-container, .alert {
            position: relative;
            z-index: 1;
        }

        .navbar {
            background-color: rgba(51, 51, 51, 0.9);
            overflow: hidden;
        }

        .navbar a, .navbar button {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
        }

        .navbar a:hover, .navbar button:hover {
            background-color: #575757;
        }

        .navbar button {
            float: right;
            margin-right: 10px;
            padding: 5px 10px;
            background: #5c67f2;
            border-radius: 5px;
            margin-top: 8px;
            padding : 7px;
            margin-bottom: 7px;
        }

        form {
            margin: 40px auto;
            padding: 20px;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button[type="submit"] {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #5c67f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #4a52c4;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 30px;
        }

        .alert {
            text-align: center;
            color: #e74c3c;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button onclick="window.location.href='/student/dashboard';">Profile</button>
    <button onclick="window.location.href='/auth/logout';">Logout</button>
</div>

<h2>Traineeship Logbook</h2>

<!-- Αν υπάρχει θέση πρακτικής -->
<main>
    <div th:if="${position != null}">
        <form th:action="@{/student/dashboard/logbook/save}" th:object="${position}" method="post">
            <label for="logbookEntry">Logbook Entry:</label>
            <textarea id="logbookEntry" th:field="*{studentLogbook}" rows="6" required></textarea>
            <button type="submit">Save Logbook</button>
        </form>
    </div>

    <!-- Αν ΔΕΝ υπάρχει θέση -->
    <div th:unless="${position != null}" class="alert">
        <h3>You have not been assigned a traineeship position yet.</h3>
    </div>
</main>

</body>
</html>
