<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traineeship Portal</title>
    <style>
        * {
            box-sizing: border-box;
        }
    body {
        background: url('/library.jpg') no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        height: 100vh;
        color: #333;
        font-family: Arial, sans-serif;
        position: relative;
    }
    
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.4);
        z-index: -1;
    }
    
    .navbar {
        background-color: #333;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
    }
    
    .navbar a,
    .navbar button {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }
    
    .navbar button {
        float: right;
        background-color: #5c67f2;
        margin-right: 10px;
        border-radius: 5px;
        padding: 7px;
        margin-top: 7px;
        margin-bottom: 7px;
    }
    
    main {
        max-width: 600px;
        margin: 100px auto 20px; /* adds space from fixed navbar */
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 8px;
    }
    
    form label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }
    
    form input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ccc;
    }
    
    form button[type="submit"] {
        margin-top: 15px;
        background-color: #5c67f2;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>

    <div class="navbar">
        <button th:onclick="'window.location.href=\'' + @{/student/logbook} + '\''">
            Logbook
        </button>        
        <button th:onclick="'window.location.href=\'' + @{/student/studentprofile} + '\''">
            Profile
        </button>
    </div> 
    
    
    <main>
        <h2>Your Profile</h2>
        <form th:action="@{/student/dashboard/profile/save}" th:object="${student}" method="post">
            <label>Full Name:</label>
            <input type="text" th:field="*{studentName}" required>
            
            <label>University ID:</label>
            <input type="text" th:field="*{AM}" required>

            <label>Average Grade:</label>
            <input type="text" th:field="*{avgGrade}" required>
            
            <label>List of Interests:</label>
            <input type="text" th:field="*{interests}" required>
            
            <label>List of Skills:</label>
            <input type="text" th:field="*{skills}" required>
            
            <label>Preferred Location:</label>
            <input type="text" th:field="*{preferredLocation}" required>
            
            <button type="submit">Save Profile</button>
        </form>
    </main>

</body>
</html>
